name: Run 8 QNX direct-ts-remux build

on:
  push:
    branches:
      - run8-build
    paths:
      - 'native/direct-ts-remux/direct_ts_remux.c'
      - 'tools/build_run8_remux.sh'
      - '.github/workflows/run8-remux-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run8-remux-build
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: run8-qnx65-armv7:4.9
  OUTDIR: build/run8-artifact

jobs:
  build:
    name: Build Run-8 direct-ts-remux
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Run-8 branch
        uses: actions/checkout@3d3c42e5aac5ba80515da1593e3d1f3122195a92

      - name: Build pinned QNX 6.5 ARMv7 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          git clone "$TOOLCHAIN_REPO" "$RUNNER_TEMP/qnx-toolchain"
          git -C "$RUNNER_TEMP/qnx-toolchain" checkout "$TOOLCHAIN_COMMIT"

          test "$(sha256sum "$RUNNER_TEMP/qnx-toolchain/Dockerfile" | awk '{print $1}')" = \
               "$TOOLCHAIN_DOCKERFILE_SHA256"

          python3 - "$RUNNER_TEMP/qnx-toolchain/Dockerfile" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          needle = "RUN dpkg --add-architecture i386 && apt-get update && \\\n"

          replacement = (
              "RUN sed -i 's#http://deb.debian.org/debian-security#"
              "http://snapshot.debian.org/archive/debian-security/20260903T220410Z#g' "
              "/etc/apt/sources.list && \\\n"
              "    echo 'Acquire::Check-Valid-Until \"false\";' "
              "> /etc/apt/apt.conf.d/99snapshot && \\\n"
              "    dpkg --add-architecture i386 && apt-get update && \\\n"
          )

          if needle not in s:
              raise SystemExit("QNX toolchain Dockerfile APT anchor not found")

          p.write_text(s.replace(needle, replacement, 1))
          PY

          docker buildx build \
            --platform=linux/amd64 \
            --target base-env \
            --build-arg BASE=base-4.9 \
            --load \
            -t "$IMAGE" \
            "$RUNNER_TEMP/qnx-toolchain"

      - name: Build Run-8 remux
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$OUTDIR"

          docker run --rm \
            --platform=linux/amd64 \
            -v "$PWD:/src" \
            -w /src \
            "$IMAGE" \
            bash ./tools/build_run8_remux.sh \
              native/direct-ts-remux/direct_ts_remux.c \
              "$OUTDIR/direct-ts-remux"

          sudo chown -R "$(id -u):$(id -g)" "$OUTDIR"

      - name: Validate Run-8 binary
        shell: bash
        run: |
          set -euxo pipefail

          BIN="$OUTDIR/direct-ts-remux"

          test -s "$BIN"

          file "$BIN" | tee "$OUTDIR/FILE.txt"

          strings "$BIN" | grep -F 'write_api=writev iovcnt=1'
          strings "$BIN" | grep -F 'MOST strict writev'
          strings "$BIN" | grep -F 'mpegts'

          docker run --rm \
            --platform=linux/amd64 \
            -v "$PWD:/src" \
            -w /src \
            "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf \
            -h "$BIN" \
            > "$OUTDIR/ELF_HEADER.txt"

          docker run --rm \
            --platform=linux/amd64 \
            -v "$PWD:/src" \
            -w /src \
            "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf \
            -S "$BIN" \
            > "$OUTDIR/SECTIONS.txt"

          grep -q 'Machine:.*ARM' "$OUTDIR/ELF_HEADER.txt"
          grep -q '\.symtab' "$OUTDIR/SECTIONS.txt"
          grep -q '\.debug_info' "$OUTDIR/SECTIONS.txt"

          sha256sum "$BIN" | tee "$OUTDIR/direct-ts-remux.sha256"

          cat > "$OUTDIR/BUILDINFO.txt" <<EOF
          artifact=direct-ts-remux
          run=8
          change=isoTX2_write_to_single_iovec_writev
          target=QNX_6.5_ARMv7_softfp
          compiler=GCC_4.9.4_QNX_ARMv7
          optimization=-O2
          debug=-g
          stripped=no
          ffmpeg=6.1.5
          ffmpeg_sha256=b8c8e926b948c14df1264cd0beac1c773df9170ac9cac97bdf1275cd3d385902
          toolchain_commit=56a66557245af14077678cd28a83ce3a337d9e2d
          source_commit=$GITHUB_SHA
          source_path=native/direct-ts-remux/direct_ts_remux.c
          EOF

          sed -i 's/^          //' "$OUTDIR/BUILDINFO.txt"

      - name: Upload Run-8 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run8-direct-ts-remux
          path: |
            build/run8-artifact/direct-ts-remux
            build/run8-artifact/direct-ts-remux.sha256
            build/run8-artifact/BUILDINFO.txt
            build/run8-artifact/FILE.txt
            build/run8-artifact/ELF_HEADER.txt
            build/run8-artifact/SECTIONS.txt