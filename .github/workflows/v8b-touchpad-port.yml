name: Fetch Luka touchpad classes

on:
  push:
    branches:
      - v8b-touchpad-port

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Luka release jars
        run: |
          set -eux
          curl -L --fail --retry 3 -o luka-current.jar \
            https://github.com/luka-dev/mib2q-carplay-rgi/releases/download/MHI2Q-2026-09-23/carplay_hook.jar
          curl -L --fail --retry 3 -o luka-may16.jar \
            https://github.com/luka-dev/mib2q-carplay-rgi/releases/download/MHI2Q-2026-05-16/carplay_hook.jar
          test "$(sha256sum luka-current.jar | awk '{print $1}')" = "5a1ed6ad2f8b1d93981801009864ce47583ad5a2edb617b518ff55cde333f326"
          test "$(sha256sum luka-may16.jar | awk '{print $1}')" = "b839122c1a14379407884d58747a57d6b5026db8d04e485752d34dbd22a85e76"
      - name: Inspect both
        run: |
          set -eux
          jar tf luka-current.jar > current-entries.txt
          jar tf luka-may16.jar > may16-entries.txt
          javap -classpath luka-current.jar -p -c 'de.audi.app.terminalmode.dsi.carplay.CarplayDSILifecycleController$TerminalModeDSIKeyEventsController' > current-inner-javap.txt
          javap -classpath luka-current.jar -p -c com.luka.carplay.input.TouchpadController > current-touchpad-javap.txt
          javap -classpath luka-may16.jar -p -c 'de.audi.app.terminalmode.dsi.carplay.CarplayDSILifecycleController$TerminalModeDSIKeyEventsController' > may16-inner-javap.txt
          javap -classpath luka-may16.jar -p -c com.luka.carplay.cursor.CursorController > may16-cursor-javap.txt
          sha256sum luka-current.jar luka-may16.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: luka-touchpad-port-input-v2
          path: |
            luka-current.jar
            luka-may16.jar
            current-entries.txt
            may16-entries.txt
            current-inner-javap.txt
            current-touchpad-javap.txt
            may16-inner-javap.txt
            may16-cursor-javap.txt
            SHA256SUMS.txt
