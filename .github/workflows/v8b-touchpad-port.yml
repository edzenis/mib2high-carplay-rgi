name: Fetch Luka touchpad classes

on:
  push:
    branches:
      - v8b-touchpad-port

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Luka release jar
        run: |
          set -eux
          curl -L --fail --retry 3 \
            -o luka-carplay_hook.jar \
            https://github.com/luka-dev/mib2q-carplay-rgi/releases/download/MHI2Q-2026-09-23/carplay_hook.jar
          sha256sum luka-carplay_hook.jar
          test "$(sha256sum luka-carplay_hook.jar | awk '{print $1}')" = "5a1ed6ad2f8b1d93981801009864ce47583ad5a2edb617b518ff55cde333f326"
      - name: Extract touchpad-only classes
        run: |
          set -eux
          mkdir -p slim
          unzip -q luka-carplay_hook.jar -d full
          find full -type f | sort > full-entries.txt
          mkdir -p slim/de/audi/app/terminalmode/dsi/carplay
          mkdir -p slim/com/luka/carplay/input
          cp full/com/luka/carplay/input/TouchpadController.class slim/com/luka/carplay/input/
          cp full/com/luka/carplay/input/TouchpadController\$TouchSink.class slim/com/luka/carplay/input/
          cp full/de/audi/app/terminalmode/dsi/carplay/CarplayDSILifecycleController\$TerminalModeDSIKeyEventsController.class slim/de/audi/app/terminalmode/dsi/carplay/
          cp full/de/audi/app/terminalmode/dsi/carplay/CarplayDSILifecycleController\$TerminalModeDSIKeyEventsController\$1.class slim/de/audi/app/terminalmode/dsi/carplay/
          (cd slim && jar cf ../luka-touchpad-only.jar .)
          jar tf luka-touchpad-only.jar
          javap -classpath luka-carplay_hook.jar -p -c 'de.audi.app.terminalmode.dsi.carplay.CarplayDSILifecycleController$TerminalModeDSIKeyEventsController' > inner-javap.txt
          javap -classpath luka-carplay_hook.jar -p -c com.luka.carplay.input.TouchpadController > touchpad-javap.txt
          sha256sum luka-touchpad-only.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: luka-touchpad-port-input
          path: |
            luka-carplay_hook.jar
            luka-touchpad-only.jar
            full-entries.txt
            inner-javap.txt
            touchpad-javap.txt
            SHA256SUMS.txt
